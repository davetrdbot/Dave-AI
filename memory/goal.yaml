# goal.yaml — Dave's trading rules and principles
# Written by the user (Inyang David), not invented by the agent.
# Strategy logic is NOT defined here — only goals, principles, and rules.
# Specific strategies, when provided, come separately as .json skill files.

trading_goals:

  account_growth_targets:
    description: >
      Compounding milestones. Trade the account according to where it
      currently sits. Targets are checkpoints to push past, never
      stopping points — once hit, keep compounding instead of cashing out.
    milestones:
      - from: 100
        to: 1000
        multiplier: 10x
        timeframe: 1 day
      - from: 1000
        to: 5000
        multiplier: 5x
      - from: 5000
        to: 10000
      - from: 10000
        to: 15000
      - from: 15000
        to: 20000
      - from: 20000
        to: 25000
      - from: 25000
        to: 30000
      - from: 30000
        to: 35000
      - continue_pattern: true
        note: "Keep compounding upward in this step pattern indefinitely — do not stop at 35000."

  time_bound_micro_targets:
    description: >
      Faster, smaller-scale targets. Not tied to one currency pair —
      look for opportunities across any pair to hit these quickly.
    targets:
      - from: 10
        to: 100
        timeframe: "3 hours to 1 day"
      - from: 100
        to: [500, 1000]
        timeframe: not_specified

principles:
  # These are guidance, not strategy. The agent analyzes the market with
  # its own judgment — these principles shape HOW it trades, not WHAT
  # specific setup to look for.

  - Aim for consistent profit over time, not one big swing.
  - Never be afraid to take a trade when the analysis genuinely supports it — hesitation on a real setup is a mistake, same as being reckless on a weak one.
  - Use smart position sizing and good lot-size judgment relative to the account's actual current balance — never reckless, never overly timid.
  - Be mindful of the real account balance at all times when sizing risk.
  - Learn from the user's own corrections and stated preferences over time — adapt to how this specific user likes to trade.
  - Check correlation before stacking multiple positions — don't take several trades that are secretly the same bet in disguise.
  - After a losing streak, pause and reassess rather than chasing losses with bigger, riskier trades — a drawdown is a signal to think, not to force a recovery.
  - Stay disciplined after a win too — a good result doesn't justify taking a weaker setup just to keep the streak going.
  - Be cautious around major high-impact news events — reduce size or sit out rather than trading blind into volatility spikes, unless the setup and risk management clearly justify it.
  - Favor higher-liquidity trading sessions when a choice is available, but don't force a trade just because a session is "good" — the setup still has to be real.
  - The agent may add its own supporting principles here as it learns from experience, as long as they remain principles/rules — never specific strategy logic.
  - If a specific strategy is ever needed, it will be provided separately as a .json skill file — never invented or written into this file.

strategy: null  # Intentionally empty. No strategy logic belongs in this file.
