name: Android app

# Builds the Dave admin app (apps/dave_mobile) and, on main, publishes the APK as a GitHub Release
# so the phone can download it directly. Android only -- there is no iOS build.
on:
  push:
    paths:
      - "apps/dave_mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write # to create the release on main

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dave_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Optional real release key. Without these secrets the APK is signed with a throwaway debug
      # key: it installs fine, but Android will refuse to install the NEXT build over it (different
      # key), so each update then needs an uninstall first. With them, updates install in place.
      #   ANDROID_KEYSTORE_BASE64  base64 of the .jks file
      #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DAVE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret -- signing with a debug key. Updates will need an uninstall first."
          fi

      # The run number is the version code, so every build is newer than the last and Android
      # accepts it as an update.
      - name: Build APK
        env:
          DAVE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DAVE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DAVE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/Dave.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Dave-apk
          path: ${{ runner.temp }}/Dave.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-build-${{ github.run_number }}
          name: Dave app (build ${{ github.run_number }})
          body: |
            Android admin app for Dave. Download **Dave.apk** on the phone and open it to install
            (allow "install unknown apps" for your browser when Android asks).

            First time: in the web panel open **Phone App**, tap **Get a pairing code**, then enter
            your server address and the code in the app.
          files: ${{ runner.temp }}/Dave.apk
          make_latest: true
