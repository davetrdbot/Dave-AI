# Step 20.2: ffmpeg is required for real scene-aware keyframe extraction
# (packages/dave-vision) but is NOT included by default in a Nixpacks
# Node.js build (confirmed via research against Railway's own docs) --
# `...` merges this with Nixpacks' auto-detected Node toolchain rather
# than replacing it.
#
# Item 2 (admin "Load Model on Railway" toggle): Nixpacks normally picks
# ONE primary provider by repo structure -- seeing package.json means it
# builds a Node-only plan and never touches Python at all. `providers`
# forces both toolchains in explicitly (confirmed real current syntax).
# pip installs into its OWN venv in a custom phase, not directly via the
# Nix-provided python3 -- real PEP 668 gotcha, confirmed via research:
# Nix's Python is externally-managed, so a bare `pip install` fails;
# dave-brain's local-model launcher spawns `/opt/dave-ai-brain-venv/bin/python3`
# for exactly this reason, never a bare `python3`.
providers = ["python", "node"]

[phases.setup]
nixPkgs = ["...", "ffmpeg", "python311"]

[phases.installPython]
dependsOn = ["setup"]
cmds = [
  "python3 -m venv /opt/dave-ai-brain-venv",
  "/opt/dave-ai-brain-venv/bin/pip install -r ai-brain-service/requirements.txt",
]
